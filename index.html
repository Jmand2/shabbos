<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12141F">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shabbos Clock</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="flights.css">
</head>
<body>
<main id="screen">
  <!-- One dated tile on the left; the clock owns everything to its right and
       centres in that space. The two tiles used to flank the numerals, which
       meant the wider of them set the clock's width budget on BOTH sides. One
       tile costs the clock its own width once, and nothing else. -->
  <div class="topline">
    <aside class="datebox">
      <div class="civil" id="civilDate"></div>
      <div class="hebrew" id="hebrewDate"></div>
      <div class="occasion" id="occasion"></div>
      <p class="edge" id="edge"></p>
      <div class="zmanim" id="zmanimList"></div>
    </aside>

    <!-- A size container, so the numerals are sized against the width actually
         left to them rather than against a vw guess that has to be re-derived
         every time a tile changes. cqi is that width; the vw rule below stays
         as the fallback where container queries are missing. -->
    <div class="clockwrap">
    <div class="clock" id="clock">
    <span class="hm" id="clockTime">--:--</span><!--
    --><span class="suffix">
      <span class="mer" id="clockMer"></span>
      <!-- Subsidiary seconds, beside the numerals rather than under them. Ticks
           every five seconds, longer at the quarters, and a hand with a
           counterbalance tail so the pivot reads as the centre. -->
      <svg class="dial" id="dial" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="dial-ring" cx="50" cy="50" r="45"/>
        <g class="dial-tick">
          <line x1="72.25" y1="11.46" x2="69.50" y2="16.23"/>
          <line x1="88.54" y1="27.75" x2="83.77" y2="30.50"/>
          <line x1="88.54" y1="72.25" x2="83.77" y2="69.50"/>
          <line x1="72.25" y1="88.54" x2="69.50" y2="83.77"/>
          <line x1="27.75" y1="88.54" x2="30.50" y2="83.77"/>
          <line x1="11.46" y1="72.25" x2="16.23" y2="69.50"/>
          <line x1="11.46" y1="27.75" x2="16.23" y2="30.50"/>
          <line x1="27.75" y1="11.46" x2="30.50" y2="16.23"/>
        </g>
        <g class="dial-quarter">
          <line x1="50" y1="5.5" x2="50" y2="14"/>
          <line x1="94.5" y1="50" x2="86" y2="50"/>
          <line x1="50" y1="94.5" x2="50" y2="86"/>
          <line x1="5.5" y1="50" x2="14" y2="50"/>
        </g>
        <line class="dial-hand" id="dialHand" x1="50" y1="61" x2="50" y2="13"/>
        <circle class="dial-pin" cx="50" cy="50" r="3.4"/>
      </svg>
    </span>
    </div>
    </div>
  </div>

  <!-- Horizon: the solar day, dawn on the left and nightfall on the right, with
       the real zmanim marked and the sun at now. It carries no minyan times —
       the cards do that, in numerals big enough to read across a room. -->
  <figure class="horizon" aria-hidden="true">
    <div class="arc">
      <div class="arc-line">
        <div class="arc-track"></div>
        <div class="arc-elapsed" id="horizonElapsed"></div>
        <div class="marks" id="horizonMarks"></div>
        <span class="sun" id="sun"></span>
      </div>
    </div>
  </figure>

  <!-- The sky for as long as the display can usefully say: a rolling window of
       real hourly forecast, labelled with the Shabbos or Yom Tov it falls in.
       It takes its band off the cards, which were taller than their contents
       needed. -->
  <section class="weather" id="weather" hidden></section>

  <section class="shuls" id="shuls"></section>

  <footer class="footer">
    <span id="freshness"></span>
    <button class="gear" id="gear" type="button" aria-label="Settings">Settings</button>
  </footer>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button class="close" id="close" type="button">Done</button>
    </div>

    <h3>Shuls to show</h3>
    <p class="hint">Times come from teaneckminyanim.com. A shul with no confirmed times for today says so rather than showing an estimate.</p>
    <div class="picker" id="shulPicker"></div>

    <h3>Display</h3>
    <label class="row"><span>Layout</span>
      <select id="layout">
        <option value="board">Full board</option>
        <option value="clock">Clock only</option>
      </select>
    </label>
    <label class="row"><span>Times shown per shul</span>
      <select id="perShul">
        <option value="auto">Auto — as many as stay readable</option>
        <option value="4">Next 4</option>
        <option value="8">Next 8</option>
        <option value="12">Next 12</option>
      </select>
    </label>
    <label class="row"><span>Theme</span>
      <select id="theme">
        <option value="auto">Night after dark</option>
        <option value="night">Always night</option>
        <option value="day">Always day</option>
      </select>
    </label>
    <label class="row"><span>Accent</span>
      <select id="accent">
        <option value="brass">Brass</option>
        <option value="copper">Copper</option>
        <option value="sage">Sage</option>
        <option value="ice">Ice</option>
        <option value="purple">Purple</option>
      </select>
    </label>
    <label class="row"><span>Clock face</span>
      <select id="face">
        <option value="sturdy">Sturdy</option>
        <option value="classic">Classic</option>
        <option value="elegant">Elegant</option>
        <option value="clean">Clean</option>
      </select>
    </label>
    <label class="row"><span>Clock size</span>
      <select id="clockSize">
        <option value="0.8">Smaller</option>
        <option value="1">Standard</option>
        <option value="1.25">Larger</option>
      </select>
    </label>
    <label class="row"><span>Show seconds</span><input type="checkbox" id="seconds"></label>
    <label class="row"><span>Show the day horizon</span><input type="checkbox" id="showHorizon"></label>
    <label class="row"><span>Show zmanim strip</span><input type="checkbox" id="showZmanim"></label>
    <label class="row"><span>Show the weather</span><input type="checkbox" id="showWeather"></label>
    <label class="row"><span>Temperature</span>
      <select id="units">
        <option value="F">Fahrenheit</option>
        <option value="C">Celsius</option>
      </select>
    </label>

    <h3>System status</h3>
    <p class="hint">For when the display is behaving oddly and nobody is standing next to it. Nothing here changes anything.</p>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="vendor/kosher-zmanim.min.js"></script>
<script src="app.js"></script>
<script src="flights.js"></script>
</body>
</html>
