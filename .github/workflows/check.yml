# The regression suites, on every push and pull request.
#
# They existed and nothing ran them, so a break only showed up when somebody
# thought to run them by hand — which is how four assertions sat red for a week.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # WebKit, because that is what the iPad runs. The layout suite is the only
      # thing here that can see a real box.
      - run: npx playwright install --with-deps webkit

      # Behaviour over time: the board repainting, the horizon rolling over at
      # nightfall, the weather window, the Yom Tov span. Reads its minyan times
      # from scripts/fixtures/, so a scraper run cannot turn it red.
      - name: check:ui
        run: npm run check:ui

      # One frozen moment, many of them: every Shabbos and Yom Tov transition,
      # the failure modes, the normalisation rules, and a full year of renders.
      - name: check
        run: npm run check

      # Real WebKit at real iPad sizes. Asserts that nothing overflows its box
      # and that the numerals stay large enough to read across a room — the one
      # thing jsdom cannot see, because it computes no geometry at all.
  # The layout suite asserts real pixel sizes, so it has to run somewhere with
  # the fonts the iPad actually has. A Linux runner substitutes DejaVu for
  # Superclarendon and every measurement shifts — it would be testing the
  # runner's font stack, not this app.
  layout:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install webkit

      - name: check:layout
        run: npm run check:layout

      - name: screenshots
        if: failure()
        run: npm run screenshots || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: screenshots/
