# The regression suites, on every push and pull request.
#
# They existed and nothing ran them, so a break only showed up when somebody
# thought to run them by hand — which is how four assertions sat red for a week.
name: Checks

# The scraper pushes three times a day and changes nothing but generated JSON.
# Running WebKit on macOS plus every behavioural suite against that is minutes of
# CI for a file the app only reads. The data still gets checked — refresh-
# minyanim.yml validates it on the way out, which is both cheaper and closer to
# where a bad scrape would come from.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/minyanim.json'
      - 'screenshots/**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # WebKit, because that is what the iPad runs. The jsdom suites need none
      # of this; check:sw does, because a service worker needs a real browser.
      - run: npx playwright install --with-deps webkit

      # Behaviour over time: the board repainting, the horizon rolling over at
      # nightfall, the weather window, the Yom Tov span. Reads its minyan times
      # from scripts/fixtures/, so a scraper run cannot turn it red.
      - name: check:ui
        run: npm run check:ui

      # One frozen moment, many of them: every Shabbos and Yom Tov transition,
      # the failure modes, the normalisation rules, and a full year of renders.
      - name: check
        run: npm run check

      # The worker's one real promise: install a generation, publish a second,
      # reload through a half-working network, and assert the page is never
      # built out of both. Fonts cannot matter here, so it runs on Linux.
      - name: check:sw
        run: npm run check:sw

      # Real WebKit at real iPad sizes. Asserts that nothing overflows its box
      # and that the numerals stay large enough to read across a room — the one
      # thing jsdom cannot see, because it computes no geometry at all.
  # The layout suite asserts real pixel sizes, so it has to run somewhere with
  # the fonts the iPad actually has. A Linux runner substitutes DejaVu for
  # Superclarendon and every measurement shifts — it would be testing the
  # runner's font stack, not this app.
  layout:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install webkit

      - name: check:layout
        run: npm run check:layout

      - name: screenshots
        if: failure()
        run: npm run screenshots || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: screenshots/
