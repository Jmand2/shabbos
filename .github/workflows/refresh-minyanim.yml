name: Refresh minyan times

on:
  schedule:
    - cron: '0 8,15,22 * * *'   # 3x daily UTC; catches same-day schedule changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-minyanim.mjs

      # The scrape checks itself here rather than in the full suites, which no
      # longer run on a data-only push. No browser and no jsdom — this is about
      # the file, and it runs where a bad one comes from.
      - name: Validate the scrape
        id: validate
        run: node scripts/check-data.mjs

      - name: Commit if changed
        run: |
          git config user.name  "shabbos-clock-bot"
          git config user.email "actions@github.com"
          git add data/minyanim.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh minyan times"
          git pull --rebase --autostash
          git push

      # AFTER the commit, deliberately.
      #
      # A well-formed file that the source has not finished filling in is worth
      # a red X — somebody should look at whether a shul has gone missing — but
      # it is not worth withholding. Gated BEFORE the commit, this exact
      # condition held the wall on a month-old file for two weeks: one shul's
      # unpublished Mincha, and every run's good data discarded with it.
      - name: Report incomplete source data
        if: steps.validate.outputs.incomplete == '1'
        run: |
          echo "The data was committed. The source is missing times for a shul on the wall;"
          echo "see the warning annotations on this run."
          exit 1
