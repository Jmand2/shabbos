name: Refresh minyan times

on:
  schedule:
    - cron: '0 8,15,22 * * *'   # 3x daily UTC; catches same-day schedule changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-minyanim.mjs

      # The scrape checks itself here rather than in the full suites, which no
      # longer run on a data-only push. No browser and no jsdom — this is about
      # the file, and it runs where a bad one comes from.
      - name: Validate the scrape
        run: node scripts/check-data.mjs

      - name: Commit if changed
        run: |
          git config user.name  "shabbos-clock-bot"
          git config user.email "actions@github.com"
          git add data/minyanim.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh minyan times"
          git pull --rebase --autostash
          git push
