# Writes the commit the site was built from into version.json, so the iPad can
# say which one it is actually running.
#
# "Is the display on the latest version?" is otherwise unanswerable from across
# a room: GitHub Pages, Safari and the service worker each hold a copy, and any
# of them can be the stale one.
name: Stamp version

# NOT on a data-only push. The stamp rewrites the service worker's VERSION, and
# one VERSION is one immutable app-shell generation — so stamping a commit that
# only changed data/minyanim.json would make every iPad download and reinstall
# the entire shell. The scraper commits three times a day. Minyan times are
# deliberately not part of the shell; this is what keeps that true in practice
# rather than only in the comments.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/minyanim.json'
      - 'README.md'
      - 'screenshots/**'

permissions:
  contents: write

concurrency:
  group: stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build into version.json and sw.js
        run: |
          SHA="$(git rev-parse --short HEAD)"
          printf '{\n  "commit": "%s",\n  "built_at": "%s"\n}\n' \
            "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

          # The worker's cache is now generation-scoped and cache-first, so the
          # version MUST change whenever the code does or an iPad would sit on
          # an old shell forever. Deriving it from the commit is the only way
          # that promise survives a tired evening.
          perl -pi -e "s/^const VERSION = '[^']*';/const VERSION = '\Q$SHA\E';/" sw.js

          grep -n "^const VERSION" sw.js
          cat version.json
          # A stamp that did not take would be silent and would break updates.
          grep -q "^const VERSION = '$SHA';" sw.js || { echo "sw.js was not stamped"; exit 1; }

      - name: Commit if changed
        run: |
          git config user.name  "shabbos-clock-bot"
          git config user.email "actions@github.com"
          git add version.json sw.js
          git diff --staged --quiet && exit 0
          # Skips CI on purpose: this commit is a stamp, not a change to test.
          git commit -m "Stamp build [skip ci]"
          git pull --rebase --autostash
          git push
